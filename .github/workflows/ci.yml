name: Quality and security

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate

      - name: Install from lockfile without lifecycle scripts
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          # sharp is Next.js's reviewed native image dependency.
          pnpm rebuild sharp

      - name: Reject high-severity dependency advisories
        run: pnpm audit --audit-level=high

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Run unit and component tests
        run: pnpm test

      - name: Build production application
        run: pnpm build

      - name: Install Chromium runtime
        run: pnpm exec playwright install --with-deps chromium

      - name: Run desktop and touch-mobile browser tests
        run: pnpm test:e2e
